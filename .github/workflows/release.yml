name: Release to Maven Central

on:
  release:
    types: [published] # Triggered ONLY when you publish a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven Central Settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.SONATYPE_USER_TOKEN }}</username>
                <password>${{ secrets.SONATYPE_TOKEN_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Extract Release Version from Tag
        run: |
          # Converts tag 'v0.1.0' -> '0.1.0'
          VERSION=${GITHUB_REF_NAME#v}
          mvn versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false

      - name: Build, Sign, and Deploy to Maven Central
        run: mvn clean deploy -P release -DskipTests
