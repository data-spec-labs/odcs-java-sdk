name: Release to Maven Central

on:
  release:
    types: [published] # Triggered ONLY when you publish a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven Central Settings
        env:
          SONATYPE_USER_TOKEN: ${{ secrets.SONATYPE_USER_TOKEN }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          cat <<EOF > ~/.m2/settings.xml
          <server>
            <id>central</id>
            <username>${SONATYPE_USER_TOKEN}</username>
            <password>${SONATYPE_TOKEN_PASSWORD}</password>
          </server>
          EOF

      - name: Extract Release Version from Tag
        run: |
          # Converts tag 'v0.1.0' -> '0.1.0'
          VERSION=${GITHUB_REF_NAME#v}
          mvn versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false

      - name: Build, Sign, and Deploy to Maven Central
        run: mvn clean deploy -P release -DskipTests
